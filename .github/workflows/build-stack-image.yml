# Builds the self-hosted Cloudflare OS stack image and publishes it to GHCR.
#
# The k3s deployment (k3s_lab repo, cloudflare-os/) pulls ghcr.io/kahdeg-15520487/cloudflare-os:latest
# with imagePullPolicy: Always, so a push to any branch here rolls the cluster pod after
# rollout restart. The `sha-<7>` tag provides a stable handle for rollbacks.
#
# Note: the WRANGLER_DEV_IP + webFetch-fallback patches live on feat/selfhost-k3s; merge that
# branch to `main` so main-branch builds carry them too.
name: build-stack-image

on:
  push:
    branches: ["feat/selfhost-k3s"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/kahdeg-15520487/cloudflare-os:latest
            ghcr.io/kahdeg-15520487/cloudflare-os:sha-${{ github.sha }}
          # Layer cache (pnpm install, frontend build, Chrome pre-warm) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
